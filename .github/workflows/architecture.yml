name: Frontend Architecture

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'platform/**'
      - 'scripts/**'
      - 'tooling/**'
      - '.ai-rules/**'
      - '.agents/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'prettier.config.mjs'
      - '.prettierignore'
      - '.editorconfig'
      - '.github/workflows/architecture.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'platform/**'
      - 'scripts/**'
      - 'tooling/**'
      - '.ai-rules/**'
      - '.agents/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'prettier.config.mjs'
      - '.prettierignore'
      - '.editorconfig'
      - '.github/workflows/architecture.yml'

jobs:
  ai-toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run rules:setup
      - run: npm run rules:doctor
      - run: npm run rules:check
      - run: npm run docs:build

  boundaries-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:packages
      - run: npm run check:architecture
      - run: npm run test:party-conventions
