name: Frontend Architecture

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'platform/**'
      - 'scripts/**'
      - 'tooling/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'prettier.config.mjs'
      - '.prettierignore'
      - '.editorconfig'
      - '.github/workflows/architecture.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'platform/**'
      - 'scripts/**'
      - 'tooling/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'prettier.config.mjs'
      - '.prettierignore'
      - '.editorconfig'
      - '.github/workflows/architecture.yml'

jobs:
  boundaries-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:packages
      - run: npm run check:architecture
