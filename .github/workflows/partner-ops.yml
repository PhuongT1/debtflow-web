name: Partner Operations

on:
  pull_request:
    paths:
      - "apps/partner-ops/**"
      - "packages/**"
      - "platform/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/partner-ops.yml"
  push:
    branches: [main]
    paths:
      - "apps/partner-ops/**"
      - "packages/**"
      - "platform/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/partner-ops.yml"

jobs:
  check-partner-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:partner-ops
